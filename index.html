<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Exploration Quiz</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--fg:#1c2033;--muted:#6b7190;--accent:#5b5bf0;--ok:#22c55e;--bad:#ef4444;--bd:#dfe3f0}
@media(prefers-color-scheme:dark){:root{--bg:#0d1020;--card:#171b31;--fg:#e8eaf6;--muted:#9097b8;--accent:#8b8bff;--bd:#2a3050}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:32px 16px;color:var(--fg);background:
radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),
radial-gradient(1px 1px at 90px 120px,#fff,transparent),
radial-gradient(2px 2px at 160px 70px,#cfd8ff,transparent),
radial-gradient(1px 1px at 60px 180px,#fff,transparent),
radial-gradient(ellipse at 80% 10%,#4b2a8a88,transparent 50%),
radial-gradient(ellipse at 10% 90%,#1e4fa888,transparent 50%),
#05060f;background-size:200px 200px,200px 200px,200px 200px,200px 200px,auto,auto,auto;background-attachment:fixed;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
main{width:100%;max-width:520px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:24px;box-shadow:0 0 40px rgba(120,100,255,.35);backdrop-filter:blur(6px)}
h1{font-size:20px;margin:0 0 16px}
.top{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:8px}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5b5bf0,#a855f7,#ec4899);transition:width .4s}
h2{font-size:17px;margin:0 0 14px}
button.opt{display:block;width:100%;text-align:left;margin:0 0 10px;padding:12px 14px;font:inherit;color:inherit;background:transparent;border:2px solid var(--bd);border-radius:10px;cursor:pointer;transition:.15s}
button.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
button.opt:disabled{cursor:default}
.ok{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important;animation:pop .4s}
.bad{background:var(--bad)!important;border-color:var(--bad)!important;color:#fff!important;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
@keyframes pop{50%{transform:scale(1.04)}}
.next,.again{margin-top:6px;padding:10px 18px;font:inherit;font-weight:600;color:#fff;background:var(--accent);border:0;border-radius:10px;cursor:pointer}
.next[hidden]{display:none}
.res{text-align:center}.res .emoji{font-size:64px;animation:pop .6s}.res .big{font-size:32px;font-weight:700}
.review{text-align:left;margin:16px 0}.review summary{color:var(--accent);font-weight:600;cursor:pointer}
.review-item{padding:10px 0;border-top:1px solid var(--bd)}.review-item p{margin:4px 0}
.review-item .correct{color:var(--ok);font-weight:600}.review-item .incorrect{color:var(--bad);font-weight:600}
</style>
</head>
<body>
<main>
<h1>🚀 Space Exploration Quiz</h1>
<div id="app"></div>
</main>
<script>
const Q=[
["Who was the first human in space?",["Neil Armstrong","Yuri Gagarin","Buzz Aldrin","Alan Shepard"],1],
["Which year did Apollo 11 land on the Moon?",["1965","1969","1972","1975"],1],
["Which planet has the Great Red Spot?",["Mars","Saturn","Jupiter","Neptune"],2],
["What is the name of NASA's Mars rover that landed in 2021?",["Curiosity","Opportunity","Perseverance","Spirit"],2],
["Which probe left the solar system into interstellar space first?",["Voyager 1","Pioneer 10","New Horizons","Cassini"],0],
["What was the first artificial satellite?",["Explorer 1","Sputnik 1","Vanguard 1","Telstar"],1],
["Which telescope launched in 2021 observes in infrared?",["Hubble","Kepler","James Webb","Spitzer"],2],
["Which moon of Saturn has a thick atmosphere?",["Europa","Titan","Io","Triton"],1],
["Who was the first woman in space?",["Sally Ride","Valentina Tereshkova","Mae Jemison","Peggy Whitson"],1],
["What was the name of the first reusable US space shuttle to fly?",["Columbia","Challenger","Discovery","Atlantis"],0]];
const app=document.getElementById("app");
let i=0,score=0,answers=[];
function show(){
  if(i>=Q.length)return end();
  const [q,o,a]=Q[i];
  app.innerHTML=`<div class="top"><span>Question ${i+1} / ${Q.length}</span><span>Score: ${score}</span></div>
  <div class="bar"><i style="width:${i/Q.length*100}%"></i></div><h2></h2><div id="o"></div><button class="next" hidden></button>`;
  app.querySelector("h2").textContent=q;
  const box=app.querySelector("#o"),next=app.querySelector(".next");
  o.forEach((t,k)=>{
    const b=document.createElement("button");b.className="opt";b.textContent=t;
    b.onclick=()=>{
      box.querySelectorAll("button").forEach(x=>x.disabled=true);
      answers[i]=k;
      if(k===a){score++;b.classList.add("ok");app.querySelector(".top span:last-child").textContent="Score: "+score}
      else{b.classList.add("bad");box.children[a].classList.add("ok")}
      app.querySelector(".bar i").style.width=(i+1)/Q.length*100+"%";
      next.textContent=i+1<Q.length?"Next →":"See results";next.hidden=false;next.focus();
    };
    box.appendChild(b);
  });
  next.onclick=()=>{i++;show()};
}
function end(){
  const p=score/Q.length,e=p==1?"🏆":p>=.8?"🤩":p>=.6?"😎":p>=.4?"🙂":"🌑";
  const m=p==1?"Perfect! Mission commander material.":p>=.6?"Great flight!":"Keep exploring — try again!";
  app.innerHTML=`<div class="res"><div class="emoji">${e}</div><div class="big">${score} / ${Q.length}</div><p>${m}</p><button class="again">Play again</button></div>`;
  const review=document.createElement("details");review.className="review";
  const summary=document.createElement("summary");summary.textContent="Review your answers";review.appendChild(summary);
  Q.forEach(([q,o,a],n)=>{
    const item=document.createElement("div");item.className="review-item";
    const question=document.createElement("p");question.textContent=`${n+1}. ${q}`;
    const answer=document.createElement("p");answer.textContent=`Your answer: ${o[answers[n]]??"Not answered"}`;
    const correct=document.createElement("p");correct.textContent=`Correct answer: ${o[a]}`;
    const status=document.createElement("p");
    const isCorrect=answers[n]===a;
    status.className=isCorrect?"correct":"incorrect";status.textContent=isCorrect?"Correct":"Incorrect";
    item.append(question,answer,correct,status);review.appendChild(item);
  });
  app.querySelector(".res").insertBefore(review,app.querySelector(".again"));
  app.querySelector(".again").onclick=()=>{i=score=0;answers=[];show()};
}
show();
</script>
</body>
</html>
